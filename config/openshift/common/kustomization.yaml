# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: netobserv-

resources:
- monitor.yaml

patches:
  - path: ./manager-patch.yaml
    target:
      kind: Deployment
      name: controller-manager
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: openshift-network-observability
      - op: replace
        path: /subjects/1/namespace
        value: openshift-network-observability
      - op: replace
        path: /subjects/2/namespace
        value: openshift-network-observability
    target:
      kind: ClusterRoleBinding
      name: informers
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: openshift-network-observability
    target:
      kind: ClusterRoleBinding
      name: hostnetwork
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: openshift-network-observability
      - op: replace
        path: /subjects/1/namespace
        value: openshift-network-observability
    target:
      kind: ClusterRoleBinding
      name: loki-writer
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: openshift-network-observability
    target:
      kind: ClusterRoleBinding
      name: token-review
# Labels to add to all resources and selectors.
#commonLabels:
#  someName: someValue

bases:
- ../../crd
- ../../rbac
- ../../manager
- ../../webhook
patchesStrategicMerge:
- patch.yaml
